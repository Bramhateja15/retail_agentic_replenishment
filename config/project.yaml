project:
  name: "retail_agentic_replenishment"
  phase: "data_foundation"

freshretailnet:
  hf_dataset_id: "Dingdong-Inc/FreshRetailNet-50K"

gdelt:
  source: "https://www.gdeltproject.org/data.html"
  # Confirmed by Phase C inspection: FreshRetailNet train + eval cover
  # 2024-03-28 to 2024-07-02. These are the values used for the download
  # recorded in results/metadata/gdelt_raw_manifest.json.
  start_date: "2024-03-28"
  end_date: "2024-07-02"
  buffer_days: 3
  # 4 of the 96 daily 15-minute GKG files (UTC). In China time (UTC+8)
  # these are 08:00, 14:00, 20:00 and 02:00 of the next day.
  snapshot_times: ["000000", "060000", "120000", "180000"]
  timezone_for_daily_aggregation: "Asia/Shanghai"

notes:
  - "GDELT is a curated, publicly documented database, not an
     unstructured source. Its raw event/GKG files are multi-field
     and semi-structured, requiring parsing, validation, extraction
     and aggregation before use — that is the basis for describing
     it as requiring substantial preparation, not a claim that the
     source itself is unstructured."
  - "FreshRetailNet is the primary operational dataset; GDELT is
     external daily context. Integration is by date only."
  - "GDELT is a systematic sample (4 of 96 daily files), so daily features
     must be shares or averages, not raw article counts."
  - "Leakage rules: no statistic is computed across the train/eval split;
     the eval split (2024-06-26 to 2024-07-02) is reserved as the final
     untouched test set; news is joined with a one-day lag."
